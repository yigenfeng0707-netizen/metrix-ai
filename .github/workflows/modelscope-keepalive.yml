name: ModelScope Demo Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping public Demo with browser UA
        env:
          DEMO_URL: https://${{ secrets.MS_STUDIO_OWNER }}-${{ secrets.MS_STUDIO_NAME }}.ms.show
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          url="${DEMO_URL%/}"
          code=$(curl -sS -L --max-time 30 -A "$UA" -o /tmp/ms_body.txt -w '%{http_code}' "$url/healthz" || true)
          echo "healthz HTTP $code"
          if [ "$code" != "200" ]; then
            home=$(curl -sS -L --max-time 30 -A "$UA" -o /dev/null -w '%{http_code}' "$url/" || true)
            echo "home HTTP $home"
          fi
          case "$code" in
            200) echo "OK keepalive" ;;
            403) echo "Gateway or private; logged, not failing" ;;
            *) echo "Unexpected healthz; home ping logged" ;;
          esac
